plex:
  url: "http://192.168.1.69:32400"
  token: "YOUR_PLEX_TOKEN"
  library: "Music"

path_mapping:
  itunes_prefix: "file://localhost/D:/Music/iTunes/iTunes Media/Music/"
  plex_prefix: "/media/music/"

itunes:
  library_xml: "D:\\Music\\iTunes\\iTunes Library.xml"

sync:
  # Album-level: iTunes playlist -> Plex Collection
  collections:
    # One-way (default): iTunes is authoritative. Albums in the Plex
    # collection but not the iTunes playlist are removed from Plex.
    "iTunes Playlist Name": "Plex Collection Name"

    # Two-way: an album added to the collection *in Plex* is imported back
    # into the iTunes playlist instead of being deleted as stale. Requires
    # iTunes (COM) and the itunes-automation package. Removals from the
    # iTunes side additionally need --allow-itunes-removals.
    "Another iTunes Playlist":
      target: "Another Plex Collection"
      direction: two-way        # or: itunes-to-plex (default)

  # Track-level: iTunes playlist -> Plex Playlist (preserves order)
  playlists:
    "iTunes Playlist Name": "Plex Playlist Name"

  # Record label: iTunes playlist -> Plex album studio/label field
  labels:
    "iTunes Label Playlist": "Record Label Name"
